
<div class="row">
    <div class="col-12 table-responsive">
        <table class="table table-bordered table-desing tabla-hover">
            <thead>
              <tr>
                <th scope="col" width="50">#</th>
                <th scope="col">Id</th>
                <th scope="col">Title</th>
                <th scope="col">Price</th>
                <th scope="col" class="text-center" width="90">Acción</th>
              </tr>
            </thead>
            <tbody>
              @for (product of products(); track product.id; let i = $index) {
              <tr>
                <th scope="row">{{i+1}}</th>
                <td>{{product.id}}</td>
                <td>{{product.title}}</td>
                <td>{{product.price}}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-pen-fill"></i></button>
                    <button class="btn btn-sm btn-outline-success" (click)="delete(product.id)"><i class="bi bi-trash3-fill"></i></button>
                </td>
              </tr>
              }
            </tbody>
          </table>
    </div>
</div>
